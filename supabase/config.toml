[functions.invite-employee]
# Browser publishable keys are not legacy JWTs. The handler explicitly validates
# the caller's session with Auth and performs seat/role checks using that JWT.
verify_jwt = false

[functions.admin-update]
# Handler verifies Auth identity and platform-admin permission before privileged queue access.
verify_jwt = false

[functions.employee-login]
verify_jwt = false

[functions.team-support-email]
verify_jwt = false

[functions.web-push]
verify_jwt = false

[functions.stripe-sandbox]
# The handler validates the Auth user and platform-admin row explicitly.
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-signup-webhook]
# Stripe's raw-body HMAC signature is verified instead of a Supabase JWT.
verify_jwt = false
